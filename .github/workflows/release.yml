name: Release

on:
    push:
        branches: [ main ]

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        # Skip CI-generated release commits to prevent infinite loops
        if: "!contains(github.event.head_commit.message, '[skip ci]')"
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Install dependencies
              run: npm ci

            - name: Run semantic-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                    FORCE_ALL_SCRIPTS: ${{ contains(github.event.head_commit.message, '[force-all-scripts]') && '1' || '0' }}
              run: npx semantic-release
